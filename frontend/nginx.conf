server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version in Server header and error pages
    server_tokens off;

    # Body size: slightly above 50 MB total upload limit
    client_max_body_size 55m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                                         always;
    add_header X-Frame-Options           "DENY"                                             always;
    add_header X-XSS-Protection          "1; mode=block"                                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"                 always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"        always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"    always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        # Strip backend fingerprinting headers
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
