<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promptly — AI Prompt Generator</title>

    <!-- Inline critical styles: sets dark bg before any external CSS loads,
         preventing the white flash on first paint. -->
    <style>
      html, body { background: #06060f; margin: 0; }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #06060f;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        transition: opacity 0.45s ease;
      }
      #splash.splash-out {
        opacity: 0;
        pointer-events: none;
      }

      .splash-logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .splash-icon {
        position: relative;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: linear-gradient(135deg, #7c3aed, #3b82f6);
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
        animation: splash-glow 2s ease-in-out infinite;
      }
      @keyframes splash-glow {
        0%, 100% { box-shadow: 0 0 18px rgba(124, 58, 237, 0.35); }
           50%   { box-shadow: 0 0 36px rgba(124, 58, 237, 0.65); }
      }
      .splash-wordmark {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.025em;
        -webkit-font-smoothing: antialiased;
      }

      .splash-dots {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .splash-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        animation: splash-dot 1.3s ease-in-out infinite;
      }
      .splash-dot:nth-child(1) { animation-delay: 0.0s; }
      .splash-dot:nth-child(2) { animation-delay: 0.18s; }
      .splash-dot:nth-child(3) { animation-delay: 0.36s; }
      @keyframes splash-dot {
        0%, 55%, 100% { background: rgba(139, 92, 246, 0.2); transform: scale(1);   }
              27%     { background: rgba(139, 92, 246, 0.9); transform: scale(1.55); }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" crossorigin href="/assets/index-Cl9_1U-3.css">
  </head>

    <div id="splash" aria-hidden="true">
      <div class="splash-logo">
        <div class="splash-icon">

          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="white" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
            <path d="M20 3v4"/><path d="M22 5h-4"/>
            <path d="M4 17v2"/><path d="M5 18H3"/>
          </svg>
        </div>
        <span class="splash-wordmark">Promptly</span>
      </div>
      <div class="splash-dots">
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
